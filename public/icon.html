<!DOCTYPE html>
<html lang="zh-CN" style="margin: 0; padding: 0; overflow: hidden;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ArtHub Icon</title>
  <style>
    * {
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    html, body {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      /* 不使用 -webkit-app-region: drag，防止 Windows Aero Shake 触发最小化所有窗口 */
      /* 拖拽由 JS/Rust 自行处理 */
    }

    body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: move !important;
      user-select: none !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: transparent !important;
      /* 移除 macOS 默认的白色背景 */
      background-color: transparent !important;
    }

    #icon-container {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: visible !important;
      background: transparent !important;
      background-color: transparent !important;
      /* macOS 圆角支持 - 与 Rust 代码中的 cornerRadius 保持一致 */
      border-radius: 16px !important;
      /* 确保圆角生效 */
      clip-path: inset(0 round 16px) !important;
    }

    #icon {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
      object-position: center !important;
      pointer-events: none !important;
      display: block !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="icon-container">
    <img id="icon" src="/icon.png" alt="ArtHub" />
  </div>
  <script>
    // 动态检测窗口实际大小并调整图标
    function adjustIconSize() {
      const icon = document.getElementById('icon');
      const container = document.getElementById('icon-container');
      const body = document.body;
      const html = document.documentElement;
      
      // 获取实际窗口大小
      const windowWidth = window.innerWidth || html.clientWidth || body.clientWidth;
      const windowHeight = window.innerHeight || html.clientHeight || body.clientHeight;
      
      // 计算图标大小：窗口大小的 100%
      const iconSize = Math.min(windowWidth, windowHeight);
      
      // 设置图标大小
      icon.style.width = iconSize + 'px';
      icon.style.height = iconSize + 'px';
      icon.style.maxWidth = iconSize + 'px';
      icon.style.maxHeight = iconSize + 'px';
      
      console.log('=== Icon Window Debug ===');
      console.log('Window size:', windowWidth, 'x', windowHeight);
      console.log('Icon size:', iconSize, 'x', iconSize);
      console.log('Icon natural size:', icon.naturalWidth, 'x', icon.naturalHeight);
      console.log('Icon actual size:', icon.offsetWidth, 'x', icon.offsetHeight);
    }

    // PNG 加载失败时回退到 ICO
    const iconEl = document.getElementById('icon');
    iconEl.addEventListener('error', () => {
      if (!iconEl.dataset.fallback) {
        iconEl.dataset.fallback = '1';
        iconEl.src = '/icon.ico';
      }
    });
    
    // 页面加载时调整
    window.addEventListener('load', adjustIconSize);
    
    // 窗口大小变化时调整
    window.addEventListener('resize', adjustIconSize);
    
    // 立即执行一次
    setTimeout(adjustIconSize, 0);
    
    // Tauri API 调用
    let invoke;
    
    function getInvoke() {
      if (window.__TAURI_INTERNALS__?.invoke) {
        const fn = window.__TAURI_INTERNALS__.invoke;
        return typeof fn === 'function' ? fn.bind(window.__TAURI_INTERNALS__) : null;
      }
      if (window.__TAURI_INTERNALS__?.core?.invoke) {
        const fn = window.__TAURI_INTERNALS__.core.invoke;
        return typeof fn === 'function' ? fn.bind(window.__TAURI_INTERNALS__.core) : null;
      }
      if (window.__TAURI__?.invoke) {
        const fn = window.__TAURI__.invoke;
        return typeof fn === 'function' ? fn.bind(window.__TAURI__) : null;
      }
      return null;
    }
    
    invoke = getInvoke();
    
    if (!invoke) {
      let retries = 0;
      const interval = setInterval(() => {
        invoke = getInvoke();
        if (invoke || ++retries >= 20) {
          clearInterval(interval);
        }
      }, 100);
    }
    
    let lastClickTime = 0;
    const DOUBLE_CLICK_DELAY = 300;

    // ---- 右键菜单 ----
    document.addEventListener('contextmenu', async (e) => {
      e.preventDefault();
      if (!invoke) invoke = getInvoke();
      if (invoke) {
        try { await invoke('show_icon_context_menu', { x: e.screenX, y: e.screenY }); } catch (err) { console.error('Context menu error:', err); }
      }
    });

    // ---- 左键按下：通知 Rust 启动后台拖拽线程（轮询鼠标位置，不依赖 JS mousemove） ----
    document.addEventListener('mousedown', async (e) => {
      if (e.button === 0) {
        if (!invoke) invoke = getInvoke();
        if (invoke) {
          try { await invoke('icon_drag_begin'); } catch (err) { console.error('Drag begin error:', err); }
        }
        e.preventDefault();
      }
    });

    document.addEventListener('mouseup', async (e) => {
      if (e.button === 0) {
        if (!invoke) invoke = getInvoke();
        if (invoke) {
          try { await invoke('icon_drag_end'); } catch (err) { console.error('Drag end error:', err); }
        }
      }
    });

    // ---- 双击切换主窗口 ----
    document.addEventListener('dblclick', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!invoke) invoke = getInvoke();
      if (invoke) {
        try { await invoke('icon_click'); } catch (err) { console.error('Double click error:', err); }
      }
    });

    document.addEventListener('selectstart', e => e.preventDefault());
  </script>
</body>
</html>
